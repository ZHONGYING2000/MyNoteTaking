<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinaBell Notes - A little garden for your thoughts</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
            flex: 1;
        }

        .sidebar {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 8px;
            padding: 22px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            height: fit-content;
        }

        .note-editor {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 8px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .search-box {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 20px;
            transition: border-color 0.3s ease;
        }

        .search-box:focus {
            outline: none;
            border-color: #667eea;
        }

        .new-note-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 20px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .new-note-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .notes-list {
            max-height: 500px;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .note-item {
            min-width: 0;
            padding: 15px;
            border: 2px solid transparent;
            border-radius: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }

        .note-item:hover {
            border-color: #667eea;
        }

        .note-item.active {
            border-color: #667eea;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
        }

        .note-title {
            overflow-wrap: anywhere;
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 5px;
            color: #333;
        }

        .note-preview {
            max-height: 2.8em;
            overflow-wrap: anywhere;
            font-size: 14px;
            color: #666;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .note-date {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }

        .editor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .editor-title {
            font-size: 1.5rem;
            color: #333;
        }

        .editor-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn-save {
            background: #28a745;
            color: white;
        }

        .btn-save:hover {
            background: #218838;
            transform: translateY(-1px);
        }

        .btn-delete {
            background: #dc3545;
            color: white;
        }

        .btn-delete:hover {
            background: #c82333;
            transform: translateY(-1px);
        }

        .btn-translate {
            background: #0d6efd;
            color: white;
        }

        .btn-translate:hover {
            background: #0b5ed7;
            transform: translateY(-1px);
        }

        .translation-controls {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-top: 20px;
        }

        .translation-controls .form-label {
            margin-bottom: 0;
            white-space: nowrap;
        }

        .translation-controls select {
            flex: 1;
            min-width: 0;
        }

        .attachment-section {
            margin-top: 24px;
            padding-top: 18px;
            border-top: 1px solid #e1e5e9;
        }

        .attachment-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .attachment-header .form-label {
            margin-bottom: 4px;
        }

        .attachment-help,
        .attachment-empty {
            color: #777;
            font-size: 13px;
        }

        .btn-attachment {
            background: #eef1ff;
            color: #3949ab;
            flex: 0 0 auto;
        }

        .attachment-list {
            list-style: none;
            margin-top: 12px;
        }

        .attachment-row {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
            padding: 10px 0;
            border-bottom: 1px solid #edf0f2;
        }

        .attachment-name {
            flex: 1;
            min-width: 0;
            overflow-wrap: anywhere;
        }

        .attachment-size,
        .attachment-pending {
            color: #777;
            font-size: 13px;
            white-space: nowrap;
        }

        .attachment-download {
            color: #3949ab;
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
        }

        .attachment-remove {
            border: 0;
            background: transparent;
            color: #a94f5a;
            cursor: pointer;
            font: inherit;
            font-size: 13px;
            white-space: nowrap;
        }

        .attachment-remove:hover {
            text-decoration: underline;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-textarea {
            width: 100%;
            min-height: 300px;
            padding: 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            font-family: inherit;
            resize: vertical;
            transition: border-color 0.3s ease;
            line-height: 1.6;
        }

        .form-textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .empty-state h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .empty-state p {
            font-size: 1rem;
            opacity: 0.8;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #f5c6cb;
        }

        .success {
            background: #d4edda;
            color: #155724;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #c3e6cb;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .container {
                padding: 15px;
            }
            
            .sidebar, .note-editor {
                padding: 20px;
            }
        }

        /* Custom Scrollbar */
        .notes-list::-webkit-scrollbar {
            width: 6px;
        }

        .notes-list::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 3px;
        }

        .notes-list::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 3px;
        }

        .notes-list::-webkit-scrollbar-thumb:hover {
                background: #5a6fd8;
            }

            :root {
                --ink: #3b302d;
                --muted: #7d706c;
                --forest: #326c52;
                --forest-dark: #254e3c;
                --leaf: #72a47e;
                --rose: #d87f91;
                --rose-dark: #b85d73;
                --petal: #f8e6e6;
                --paper: #fffdf9;
                --line: #e8d9d0;
            }

            body {
                font-family: 'Avenir Next', Avenir, 'Trebuchet MS', sans-serif;
                color: var(--ink);
                background-color: #edf4eb;
                background-image:
                    repeating-linear-gradient(128deg, rgba(50, 108, 82, 0.035) 0 1px, transparent 1px 30px),
                    linear-gradient(125deg, #f8eee7 0%, #edf5eb 52%, #f8e9e9 100%);
            }

            .header {
                margin: 4px 0 24px;
                padding: 0 0 17px 4px;
                    display: grid;
                    grid-template-columns: minmax(220px, 280px) minmax(0, 1fr);
                    align-items: center;
                    gap: 28px;
                text-align: left;
                color: var(--forest-dark);
                border-bottom: 1px solid rgba(50, 108, 82, 0.2);
            }

                .header-art {
                    display: block;
                    width: 100%;
                    aspect-ratio: 1597 / 1169;
                    object-fit: cover;
                    border: 1px solid rgba(50, 108, 82, 0.18);
                    border-radius: 8px;
                    box-shadow: 0 8px 20px rgba(54, 78, 56, 0.14);
                }

            .header h1,
            .editor-title {
                font-family: Georgia, 'Times New Roman', serif;
                color: var(--forest-dark);
            }

            .header h1 {
                font-size: 2.2rem;
                line-height: 1.15;
                margin-bottom: 5px;
                text-shadow: none;
            }

            .header p {
                color: var(--muted);
                opacity: 1;
            }

            .main-content {
                grid-template-columns: minmax(250px, 0.82fr) minmax(0, 2fr);
                gap: 22px;
            }

            .sidebar,
            .note-editor {
                background: rgba(255, 253, 249, 0.95);
                border: 1px solid rgba(232, 217, 208, 0.9);
                border-radius: 8px;
                box-shadow: 0 12px 30px rgba(81, 71, 57, 0.08);
                backdrop-filter: none;
            }

            .search-box,
            .form-input,
            .form-textarea {
                border: 1px solid var(--line);
                border-radius: 6px;
                background: var(--paper);
                color: var(--ink);
                transition: border-color 0.2s ease, box-shadow 0.2s ease;
            }

            .search-box:focus,
            .form-input:focus,
            .form-textarea:focus {
                border-color: var(--leaf);
                box-shadow: 0 0 0 3px rgba(114, 164, 126, 0.16);
            }

            .new-note-btn {
                border-radius: 6px;
                background: var(--rose);
            }

            .new-note-btn:hover {
                background: var(--rose-dark);
                box-shadow: none;
            }

            .note-item {
                border-radius: 6px;
                background: #f8f5ef;
            }

            .note-item:hover {
                border-color: #d8b7ad;
            }

            .note-item.active {
                border-color: var(--rose);
                background: #fbefed;
            }

            .note-title,
            .form-label {
                color: var(--ink);
            }

            .note-preview,
            .attachment-help,
            .attachment-empty,
            .attachment-size,
            .attachment-pending,
            .empty-state,
            .loading {
                color: var(--muted);
            }

            .btn {
                border-radius: 6px;
            }

            .btn-save {
                background: var(--forest);
            }

            .btn-save:hover {
                background: var(--forest-dark);
            }

            .btn-delete {
                background: #bd6670;
            }

            .btn-delete:hover {
                background: #a94f5a;
            }

            .btn-translate {
                background: #8295ad;
            }

            .btn-translate:hover {
                background: #687e99;
            }

            .attachment-section {
                border-color: var(--line);
            }

            .btn-attachment {
                background: var(--petal);
                color: var(--rose-dark);
            }

            .attachment-row {
                border-color: #f0e8df;
            }

            .attachment-download {
                color: var(--forest);
            }

            .error {
                background: #fae4e4;
                color: #80434b;
                border-color: #edc7c7;
            }

            .success {
                background: #e5f1e5;
                color: #315c42;
                border-color: #cde2d0;
            }

            .notes-list::-webkit-scrollbar-track {
                background: #f4eee8;
            }

            .notes-list::-webkit-scrollbar-thumb {
                background: var(--leaf);
            }

            .notes-list::-webkit-scrollbar-thumb:hover {
                background: var(--forest);
            }

            @media (max-width: 768px) {
                .container {
                    padding: 16px;
                }

                .sidebar,
                .note-editor {
                    padding: 18px;
                }

                .header h1 {
                    font-size: 1.8rem;
                }

                .header {
                    grid-template-columns: minmax(0, 1fr);
                    gap: 16px;
                    padding-left: 0;
                }

                .header-art {
                    width: min(100%, 420px);
                }

                .editor-header {
                    align-items: flex-start;
                    flex-direction: column;
                    gap: 12px;
                }

                .editor-actions {
                    flex-wrap: wrap;
                }
            }

            .header {
                display: grid;
                grid-template-columns: minmax(0, 1fr) 148px 54px;
                align-items: center;
                gap: 12px;
                min-height: 118px;
                margin: 0 0 18px;
                padding: 8px 4px 14px;
            }

            .header-copy {
                min-width: 0;
            }

            .header-fox,
            .header-butterfly,
            .sidebar-bear {
                display: block;
                object-fit: contain;
                pointer-events: none;
                user-select: none;
            }

            .header-fox {
                width: 148px;
                height: 124px;
            }

            .header-butterfly {
                width: 52px;
                height: 52px;
                transform: rotate(-12deg);
            }

            .sidebar-heading {
                display: flex;
                align-items: center;
                justify-content: space-between;
                min-height: 72px;
                margin-bottom: 8px;
            }

            .sidebar-heading h2 {
                color: var(--forest-dark);
                font-family: Georgia, 'Times New Roman', serif;
                font-size: 1.2rem;
            }

            .sidebar-bear {
                width: 46px;
                height: 72px;
                margin-right: 6px;
            }

            @media (max-width: 768px) {
                .header {
                    grid-template-columns: minmax(0, 1fr) 94px 40px;
                    gap: 6px;
                    min-height: 94px;
                    padding-right: 0;
                }

                .header-fox {
                    width: 94px;
                    height: 92px;
                }

                .header-butterfly {
                    width: 38px;
                    height: 38px;
                }
            }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-copy">
                <h1>🦊 LinaBell Notes</h1>
                <p>A little garden for your thoughts</p>
            </div>
            <img class="header-fox" src="/linabell-sticker.png" alt="玲娜贝儿" width="1548" height="1300">
            <img class="header-butterfly" src="/butterfly-sticker.png" alt="蝴蝶" width="1095" height="1059">
        </div>

        <div class="main-content">
            <div class="sidebar">
                <div class="sidebar-heading">
                    <h2>My notes</h2>
                    <img class="sidebar-bear" src="/bear-sticker.png" alt="熊" width="735" height="1246">
                </div>
                <input type="text" class="search-box" id="searchBox" placeholder="🔍 Search notes...">
                <button class="new-note-btn" id="newNoteBtn">✨ New Note</button>
                
                <div class="notes-list" id="notesList">
                    <div class="loading">Loading notes...</div>
                </div>
            </div>

            <div class="note-editor">
                <div class="editor-header">
                    <h2 class="editor-title" id="editorTitle">Select a note to edit</h2>
                    <div class="editor-actions" id="editorActions" style="display: none;">
                        <button class="btn btn-save" id="saveBtn">💾 Save</button>
                        <button class="btn btn-translate" id="translateBtn">🌐 Translate</button>
                        <button class="btn btn-delete" id="deleteBtn">🗑️ Delete</button>
                    </div>
                </div>

                <div id="messageArea"></div>

                <div id="editorForm" style="display: none;">
                    <div class="form-group">
                        <label class="form-label" for="noteTitle">Title</label>
                        <input type="text" class="form-input" id="noteTitle" placeholder="Enter note title...">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="noteContent">Content</label>
                        <textarea class="form-textarea" id="noteContent" placeholder="Start writing your note..."></textarea>
                    </div>

                    <section class="attachment-section" aria-labelledby="attachmentHeading">
                        <div class="attachment-header">
                            <div>
                                <label class="form-label" id="attachmentHeading" for="attachmentInput">Attachments</label>
                                <div class="attachment-help">Images and files, up to 4 MB each.</div>
                            </div>
                            <button class="btn btn-attachment" id="addAttachmentBtn" type="button">📎 Add files</button>
                            <input id="attachmentInput" type="file" hidden>
                        </div>
                        <ul class="attachment-list" id="attachmentList" aria-live="polite"></ul>
                    </section>

                    <div class="translation-controls">
                        <label class="form-label" for="targetLanguage">Translate to</label>
                        <select class="form-input" id="targetLanguage">
                            <option value="Chinese">中文</option>
                            <option value="English" selected>English</option>
                            <option value="Japanese">日本語</option>
                            <option value="Korean">한국어</option>
                        </select>
                    </div>
                </div>

                <div class="empty-state" id="emptyState">
                    <h3>Welcome to NoteTaker!</h3>
                    <p>Select an existing note or create a new one to get started.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        class NoteTaker {
            constructor() {
                this.notes = [];
                this.currentNote = null;
                this.attachments = [];
                this.pendingFiles = [];
                this.isLoading = false;
                this.messageTimeout = null;
                this.init();
            }

            async init() {
                this.bindEvents();
                await this.loadNotes();
            }

            bindEvents() {
                document.getElementById('newNoteBtn').addEventListener('click', () => this.createNewNote());
                document.getElementById('saveBtn').addEventListener('click', () => this.saveNote());
                document.getElementById('translateBtn').addEventListener('click', () => this.translateNote());
                document.getElementById('deleteBtn').addEventListener('click', () => this.deleteNote());
                document.getElementById('addAttachmentBtn').addEventListener('click', () => {
                    document.getElementById('attachmentInput').click();
                });
                document.getElementById('attachmentInput').addEventListener('change', (event) => {
                    this.handleAttachmentSelection(event.target.files);
                    event.target.value = '';
                });
                document.getElementById('attachmentList').addEventListener('click', (event) => {
                    const removeButton = event.target.closest('[data-remove-attachment]');
                    if (!removeButton) return;
                    const attachmentId = removeButton.dataset.removeAttachment;
                    this.removeAttachment(attachmentId === 'pending' ? null : Number(attachmentId));
                });
                document.getElementById('searchBox').addEventListener('input', (e) => this.searchNotes(e.target.value));
                
                // Auto-save on content change (debounced)
                let saveTimeout;
                const autoSave = () => {
                    clearTimeout(saveTimeout);
                    saveTimeout = setTimeout(() => {
                        if (this.currentNote && this.currentNote.id) {
                            this.saveNote(true);
                        }
                    }, 2000);
                };
                
                document.getElementById('noteTitle').addEventListener('input', autoSave);
                document.getElementById('noteContent').addEventListener('input', autoSave);
            }

            async loadNotes() {
                this.isLoading = true;
                this.showMessage('Loading notes...', 'loading');
                
                try {
                    const response = await fetch('/api/notes');
                    if (!response.ok) throw new Error('Failed to load notes');
                    
                    this.notes = await response.json();
                    this.renderNotesList();
                    this.hideMessage();
                } catch (error) {
                    this.showMessage(`Error loading notes: ${error.message}`, 'error');
                } finally {
                    this.isLoading = false;
                }
            }

            renderNotesList() {
                const notesList = document.getElementById('notesList');
                
                if (this.notes.length === 0) {
                    notesList.innerHTML = '<div class="empty-state"><p>No notes yet. Create your first note!</p></div>';
                    return;
                }

                notesList.innerHTML = this.notes.map(note => `
                    <div class="note-item ${this.currentNote && this.currentNote.id === note.id ? 'active' : ''}" 
                         data-note-id="${note.id}" onclick="noteTaker.selectNote(${note.id})">
                        <div class="note-title">${this.escapeHtml(note.title || 'Untitled')}</div>
                        <div class="note-preview">${this.escapeHtml(note.content || 'No content')}</div>
                        <div class="note-date">${this.formatDate(note.updated_at)}</div>
                    </div>
                `).join('');
            }

            async selectNote(noteId) {
                const note = this.notes.find(n => n.id === noteId);
                if (!note) return;

                this.hideMessage();
                this.currentNote = note;
                this.showEditor();
                this.renderNotesList(); // Re-render to update active state
                
                document.getElementById('noteTitle').value = note.title || '';
                document.getElementById('noteContent').value = note.content || '';
                document.getElementById('editorTitle').textContent = note.title || 'Untitled Note';
                this.pendingFiles = [];
                await this.loadAttachments(note.id);
            }

            createNewNote() {
                this.hideMessage();
                this.currentNote = {
                    id: null,
                    title: '',
                    content: '',
                    created_at: new Date().toISOString(),
                    updated_at: new Date().toISOString()
                };
                
                this.showEditor();
                document.getElementById('noteTitle').value = '';
                document.getElementById('noteContent').value = '';
                document.getElementById('editorTitle').textContent = 'New Note';
                this.attachments = [];
                this.pendingFiles = [];
                this.renderAttachments();
                document.getElementById('noteTitle').focus();
                
                // Remove active state from all notes
                document.querySelectorAll('.note-item').forEach(item => {
                    item.classList.remove('active');
                });
            }

            showEditor() {
                document.getElementById('emptyState').style.display = 'none';
                document.getElementById('editorForm').style.display = 'block';
                document.getElementById('editorActions').style.display = 'flex';
                this.updateDeleteButtonVisibility();
            }

            updateDeleteButtonVisibility() {
                document.getElementById('deleteBtn').style.display =
                    this.currentNote && this.currentNote.id ? 'inline-block' : 'none';
                document.getElementById('translateBtn').style.display =
                    this.currentNote && this.currentNote.id ? 'inline-block' : 'none';
            }

            hideEditor() {
                document.getElementById('emptyState').style.display = 'block';
                document.getElementById('editorForm').style.display = 'none';
                document.getElementById('editorActions').style.display = 'none';
                document.getElementById('editorTitle').textContent = 'Select a note to edit';
                this.currentNote = null;
                this.attachments = [];
                this.pendingFiles = [];
                this.renderAttachments();
            }

            async loadAttachments(noteId) {
                this.attachments = [];
                this.renderAttachments();
                try {
                    const response = await fetch(`/api/notes/${noteId}/attachments`, {
                        cache: 'no-store'
                    });
                    if (!response.ok) throw new Error('Failed to load attachments');
                    this.attachments = await response.json();
                    this.renderAttachments();
                } catch (error) {
                    this.showMessage(`Error loading attachments: ${error.message}`, 'error');
                }
            }

            renderAttachments() {
                const attachmentList = document.getElementById('attachmentList');
                if (!attachmentList) return;

                const hasAttachment = this.attachments.length > 0 || this.pendingFiles.length > 0;
                document.getElementById('addAttachmentBtn').hidden = hasAttachment;
                const savedItems = this.attachments.map(attachment => `
                    <li class="attachment-row">
                        <span class="attachment-name">${this.escapeHtml(attachment.filename)}</span>
                        <span class="attachment-size">${this.formatFileSize(attachment.size)}</span>
                        <a class="attachment-download" href="/api/notes/${this.currentNote.id}/attachments/${attachment.id}/download" download>Download</a>
                        <button class="attachment-remove" type="button" data-remove-attachment="${attachment.id}">Remove</button>
                    </li>
                `);
                const pendingItems = this.pendingFiles.map(file => `
                    <li class="attachment-row">
                        <span class="attachment-name">${this.escapeHtml(file.name)}</span>
                        <span class="attachment-size">${this.formatFileSize(file.size)}</span>
                        <span class="attachment-pending">Pending</span>
                        <button class="attachment-remove" type="button" data-remove-attachment="pending">Remove</button>
                    </li>
                `);
                const items = [...savedItems, ...pendingItems];
                attachmentList.innerHTML = items.length
                    ? items.join('')
                    : '<li class="attachment-empty">No attachments yet.</li>';
            }

            async handleAttachmentSelection(fileList) {
                const files = Array.from(fileList);
                if (!files.length) return;

                const file = files[0];
                if (file.size > 4 * 1024 * 1024) {
                    this.showMessage('File is too large. Maximum size is 4 MB.', 'error');
                    return;
                }
                if (this.attachments.length || this.pendingFiles.length) {
                    this.showMessage('Remove the current file before adding another.', 'error');
                    return;
                }

                this.pendingFiles = [file];
                this.renderAttachments();
                this.showMessage('Files will upload when you save this note.', 'success');
            }

            async removeAttachment(attachmentId) {
                if (attachmentId === null) {
                    this.pendingFiles = [];
                    this.renderAttachments();
                    this.hideMessage();
                    return;
                }
                if (!this.currentNote || !this.currentNote.id) return;

                try {
                    const response = await fetch(
                        `/api/notes/${this.currentNote.id}/attachments/${attachmentId}`,
                        { method: 'DELETE' }
                    );
                    if (!response.ok) {
                        const result = await response.json();
                        throw new Error(typeof result.error === 'string'
                            ? result.error
                            : result.error?.message || 'Unable to remove attachment');
                    }
                    this.attachments = this.attachments.filter(
                        attachment => attachment.id !== attachmentId
                    );
                    this.renderAttachments();
                    this.showMessage('Attachment removed.', 'success');
                } catch (error) {
                    this.showMessage(`Error removing attachment: ${error.message}`, 'error');
                }
            }

            async uploadAttachments(files) {
                if (!this.currentNote || !this.currentNote.id) {
                    this.pendingFiles.push(...files);
                    this.renderAttachments();
                    return;
                }

                const failedFiles = [];
                this.showMessage('Uploading attachments...', 'loading');
                for (const file of files) {
                    if (file.size > 4 * 1024 * 1024) {
                        failedFiles.push(file);
                        continue;
                    }

                    const formData = new FormData();
                    formData.append('file', file);
                    try {
                        const response = await fetch(
                            `/api/notes/${this.currentNote.id}/attachments`,
                            { method: 'POST', body: formData }
                        );
                        const result = await response.json();
                        if (!response.ok) {
                            throw new Error(typeof result.error === 'string'
                                ? result.error
                                : result.error?.message || 'Upload failed');
                        }
                        this.attachments.push(result);
                    } catch (error) {
                        failedFiles.push(file);
                    }
                }

                this.pendingFiles.push(...failedFiles);
                this.renderAttachments();
                if (failedFiles.length) {
                    this.showMessage('Some files could not be uploaded. Check the 4 MB limit and storage settings.', 'error');
                } else {
                    this.showMessage('Attachments uploaded successfully.', 'success');
                }
            }

            formatFileSize(size) {
                if (size < 1024) return `${size} B`;
                if (size < 1024 * 1024) return `${(size / 1024).toFixed(1)} KB`;
                return `${(size / (1024 * 1024)).toFixed(1)} MB`;
            }

            async translateNote() {
                if (!this.currentNote || !this.currentNote.id) return;

                const targetLanguage = document.getElementById('targetLanguage').value.trim();
                if (!targetLanguage) {
                    this.showMessage('Please enter a target language', 'error');
                    return;
                }

                const translateButton = document.getElementById('translateBtn');
                translateButton.disabled = true;
                this.showMessage('Translating note...', 'loading');

                try {
                    const response = await fetch(`/api/notes/${this.currentNote.id}/translate`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ target_language: targetLanguage })
                    });
                    const result = await response.json();
                    if (!response.ok) {
                        throw new Error(result.error?.message || 'Translation failed');
                    }

                    document.getElementById('noteTitle').value = result.translation.title;
                    document.getElementById('noteContent').value = result.translation.content;
                    document.getElementById('editorTitle').textContent = result.translation.title || 'Untitled Note';
                    this.showMessage('Translation filled in the fields. Save to update this note.', 'success');
                } catch (error) {
                    this.showMessage(`Error translating note: ${error.message}`, 'error');
                } finally {
                    translateButton.disabled = false;
                }
            }

            async saveNote(isAutoSave = false) {
                if (!this.currentNote) return;

                const title = document.getElementById('noteTitle').value.trim();
                const content = document.getElementById('noteContent').value.trim();

                if (!title && !content && this.pendingFiles.length === 0) {
                    if (!isAutoSave) {
                        this.showMessage('Please enter a title or content', 'error');
                    }
                    return;
                }

                try {
                    const noteData = {
                        title: title || 'Untitled',
                        content: content
                    };

                    let response;
                    if (this.currentNote.id) {
                        // Update existing note
                        response = await fetch(`/api/notes/${this.currentNote.id}`, {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(noteData)
                        });
                    } else {
                        // Create new note
                        response = await fetch('/api/notes', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(noteData)
                        });
                    }

                    if (!response.ok) throw new Error('Failed to save note');

                    const savedNote = await response.json();
                    this.currentNote = savedNote;
                    this.updateDeleteButtonVisibility();
                    
                    // Update notes list
                    const existingIndex = this.notes.findIndex(n => n.id === savedNote.id);
                    if (existingIndex >= 0) {
                        this.notes[existingIndex] = savedNote;
                    } else {
                        this.notes.unshift(savedNote);
                    }
                    
                    this.renderNotesList();
                    document.getElementById('editorTitle').textContent = savedNote.title;
                    
                    if (!isAutoSave) {
                        this.showMessage('Note saved successfully!', 'success');
                    }
                    if (this.pendingFiles.length && !isAutoSave) {
                        const filesToUpload = this.pendingFiles;
                        this.pendingFiles = [];
                        await this.uploadAttachments(filesToUpload);
                    }
                } catch (error) {
                    this.showMessage(`Error saving note: ${error.message}`, 'error');
                }
            }

            async deleteNote() {
                if (!this.currentNote || !this.currentNote.id) return;

                if (!confirm('Are you sure you want to delete this note?')) return;

                try {
                    const response = await fetch(`/api/notes/${this.currentNote.id}`, {
                        method: 'DELETE'
                    });

                    if (!response.ok) throw new Error('Failed to delete note');

                    // Remove from notes array
                    this.notes = this.notes.filter(n => n.id !== this.currentNote.id);
                    this.renderNotesList();
                    this.hideEditor();
                    this.showMessage('Note deleted successfully!', 'success');
                } catch (error) {
                    this.showMessage(`Error deleting note: ${error.message}`, 'error');
                }
            }

            searchNotes(query) {
                const filteredNotes = query.trim() === '' ? this.notes : 
                    this.notes.filter(note => 
                        (note.title && note.title.toLowerCase().includes(query.toLowerCase())) ||
                        (note.content && note.content.toLowerCase().includes(query.toLowerCase()))
                    );

                const notesList = document.getElementById('notesList');
                if (filteredNotes.length === 0) {
                    notesList.innerHTML = '<div class="empty-state"><p>No notes found matching your search.</p></div>';
                    return;
                }

                notesList.innerHTML = filteredNotes.map(note => `
                    <div class="note-item ${this.currentNote && this.currentNote.id === note.id ? 'active' : ''}" 
                         data-note-id="${note.id}" onclick="noteTaker.selectNote(${note.id})">
                        <div class="note-title">${this.escapeHtml(note.title || 'Untitled')}</div>
                        <div class="note-preview">${this.escapeHtml(note.content || 'No content')}</div>
                        <div class="note-date">${this.formatDate(note.updated_at)}</div>
                    </div>
                `).join('');
            }

            showMessage(message, type) {
                if (this.messageTimeout !== null) {
                    clearTimeout(this.messageTimeout);
                    this.messageTimeout = null;
                }

                const messageArea = document.getElementById('messageArea');
                messageArea.innerHTML = `<div class="${type}">${message}</div>`;
                
                if (type === 'success') {
                    this.messageTimeout = setTimeout(() => this.hideMessage(), 3000);
                }
            }

            hideMessage() {
                if (this.messageTimeout !== null) {
                    clearTimeout(this.messageTimeout);
                    this.messageTimeout = null;
                }
                document.getElementById('messageArea').innerHTML = '';
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            formatDate(dateString) {
                const date = new Date(dateString);
                const now = new Date();
                const diffTime = Math.abs(now - date);
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

                if (diffDays === 1) {
                    return 'Today';
                } else if (diffDays === 2) {
                    return 'Yesterday';
                } else if (diffDays <= 7) {
                    return `${diffDays - 1} days ago`;
                } else {
                    return date.toLocaleDateString();
                }
            }
        }

        // Initialize the app
        const noteTaker = new NoteTaker();
    </script>
</body>
</html>
